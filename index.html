<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyTrack | Live Flight Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07111f;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;
 background:#0c1b2e;
 border-bottom:1px solid #20344c;
}
.logo{font-size:26px;font-weight:bold;color:#43c6ff}
.subtitle{color:#91a7bd;font-size:12px;margin-top:5px}
.dashboard{padding:15px}
.stats{
 display:flex;
 gap:10px;
 margin-bottom:15px;
}
.stat{
 flex:1;
 background:#102238;
 padding:14px;
 border-radius:12px;
}
.stat small{color:#91a7bd}
.stat h2{margin:8px 0 0;color:#43c6ff}
.controls{display:flex;gap:8px;margin-bottom:12px}
input,button{
 padding:12px;
 border:0;
 border-radius:8px;
}
input{flex:1;min-width:0;background:#172b42;color:white}
button{background:#168ed0;color:white;font-weight:bold}
#map{height:65vh;min-height:400px}
.status{font-size:12px;color:#91a7bd;margin:10px 0}
.leaflet-popup-content-wrapper{
 background:#102238;color:white;border-radius:12px
}
.leaflet-popup-tip{background:#102238}
.detail{min-width:190px;line-height:1.8}
.detail h3{color:#43c6ff;margin:0 0 8px}
.detail b{color:#fff}
.plane{
 font-size:25px;
 text-shadow:0 0 8px #43c6ff;
}
</style>
</head>

<body>

<header>
 <div class="logo">✈ SKYTRACK</div>
 <div class="subtitle">THE WORLD ABOVE, IN REAL TIME</div>
</header>

<div class="dashboard">

 <div class="stats">
  <div class="stat">
   <small>Aircraft</small>
   <h2 id="count">0</h2>
  </div>
  <div class="stat">
   <small>Range</small>
   <h2>100 NM</h2>
  </div>
 </div>

 <div class="controls">
  <input id="search" placeholder="Flight / Registration">
  <button onclick="refreshFlights()">↻</button>
 </div>

 <div class="status" id="status">Connecting to SkyTrack...</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([25.4052,55.5136],7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'© OpenStreetMap'
}).addTo(map);

let markers=[];
let aircraft=[];

function planeIcon(heading){
 return L.divIcon({
  className:'',
  html:`<div class="plane" style="transform:rotate(${heading||0}deg)">✈</div>`,
  iconSize:[30,30],
  iconAnchor:[15,15]
 });
}

function details(a){
 const flight=(a.flight||'Unknown').trim();
 const registration=a.r||'Unknown';
 const type=a.t||'Unknown';
 const altitude=a.alt_baro;
 const speed=a.gs;
 const heading=a.track;

 return `
 <div class="detail">
 <h3>✈ ${flight}</h3>
 <b>Registration:</b> ${registration}<br>
 <b>Aircraft:</b> ${type}<br>
 <b>Altitude:</b> ${altitude==null?'Unknown':altitude+' ft'}<br>
 <b>Speed:</b> ${speed==null?'Unknown':Math.round(speed)+' knots'}<br>
 <b>Heading:</b> ${heading==null?'Unknown':Math.round(heading)+'°'}<br>
 <b>ICAO:</b> ${a.hex||'Unknown'}
 </div>`;
}

async function refreshFlights(){
 const status=document.getElementById('status');
 status.textContent='Updating aircraft...';

 try{
  const response=await fetch('/.netlify/functions/aircraft');

  if(!response.ok) throw new Error('Connection error');

  const data=await response.json();
  aircraft=(data.ac||[]).filter(a=>
   a.lat!=null && a.lon!=null &&
   a.lat!==0 && a.lon!==0 &&
   a.t!=='GND' && a.t!=='TWR'
  );

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  aircraft.forEach(a=>{
   const marker=L.marker([a.lat,a.lon],{
    icon:planeIcon(a.track)
   }).addTo(map);

   marker.bindPopup(details(a));
   markers.push(marker);
  });

  document.getElementById('count').textContent=aircraft.length;
  status.textContent='Live data • Updated '+new Date().toLocaleTimeString();

 }catch(error){
  status.textContent='تعذر الاتصال. حاول مرة ثانية.';
 }
}

document.getElementById('search').addEventListener('input',function(){
 const q=this.value.toLowerCase().trim();

 markers.forEach((marker,i)=>{
  const a=aircraft[i];
  const info=((a.flight||'')+' '+(a.r||'')+' '+(a.hex||'')).toLowerCase();

  if(!q||info.includes(q)){
   if(!map.hasLayer(marker))marker.addTo(map);
  }else{
   if(map.hasLayer(marker))map.removeLayer(marker);
  }
 });
});

refreshFlights();
setInterval(refreshFlights,60000);
</script>

</body>
</html>
