<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyTrack | Live Flight Tracker</title>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1943370699236128"
crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
--bg:#07111f;
--panel:#101f32;
--card:#172a40;
--text:#f4f7fb;
--muted:#91a5bd;
--blue:#31a8ff;
--green:#20d6a0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:17px;background:#0b192a;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #20334b}
.logo{font-size:24px;font-weight:bold;color:var(--blue)}
.logo span{color:white}
.container{max-width:1400px;margin:auto;padding:14px}
button,input,select{font:inherit}
button{background:var(--blue);color:white;border:0;border-radius:9px;padding:11px 14px;cursor:pointer}
.secondary{background:#263b54}
input,select{background:var(--panel);color:white;border:1px solid #30445e;border-radius:9px;padding:12px}
h2{font-size:19px;margin:18px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat,.flight{background:var(--panel);border:1px solid #20334b;border-radius:12px;padding:13px}
.stat strong{display:block;font-size:22px;color:var(--green)}
.stat small,.muted{color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#search{flex:1;min-width:180px}
#map{height:65vh;min-height:390px;border-radius:14px;border:1px solid #29415d;overflow:hidden;background:#15283c}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.flight strong{color:var(--blue);font-size:17px}
.flight p{margin:7px 0;color:var(--muted);font-size:13px}
.flight button{margin:3px}
#details{display:none;position:fixed;inset:0;background:#000b;z-index:1000;align-items:center;justify-content:center;padding:15px}
.modal{background:var(--panel);border:1px solid #30445e;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.modal h2{color:var(--blue)}
.modal img{width:100%;height:190px;object-fit:cover;border-radius:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #263b54}
.row span{color:var(--muted)}
footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#102139;color:white}
@media(max-width:600px){
header{padding:13px}
.logo{font-size:20px}
#map{height:60vh;min-height:350px}
.stats{gap:6px}
.stat{padding:9px 6px}
.stat strong{font-size:18px}
}
</style>
</head>
<body>
<header>
<div class="logo">✈ Sky<span>Track</span></div>
<button class="secondary" onclick="toggleLanguage()" id="langBtn">English</button>
</header>
<main class="container">
<h2 id="welcome">العالم فوقك، لحظة بلحظة.</h2>
<div class="stats">
<div class="stat"><strong id="count">--</strong><small id="aircraftLabel">الطائرات المعروضة</small></div>
<div class="stat"><strong id="avgAltitude">--</strong><small id="altitudeLabel">متوسط الارتفاع (قدم)</small></div>
<div class="stat"><strong id="updated">--</strong><small id="updateLabel">آخر تحديث</small></div>
</div>
<div class="controls">
<input id="search" placeholder="ابحث برقم الرحلة أو التسجيل أو ICAO">
<select id="typeFilter">
<option value="">كل الطائرات</option>
<option value="A380">A380</option>
<option value="A350">A350</option>
<option value="B777">B777</option>
<option value="B787">B787</option>
<option value="A320">A320</option>
</select>
<button onclick="locateMe()" id="locationBtn">موقعي</button>
<button class="secondary" onclick="toggleFavorites()" id="favBtn">المفضلة ★</button>
</div>
<div id="map"></div>
<h2 id="listTitle">الرحلات القريبة من الخريطة</h2>
<p class="muted" id="status">جاري تحميل بيانات الطائرات...</p>
<div class="list" id="flightList"></div>
<h2 id="historyTitle">آخر الطائرات التي شاهدتها</h2>
<div class="list" id="historyList"></div>
</main>
<div id="details" onclick="closeDetails(event)">
<div class="modal" onclick="event.stopPropagation()">
<button class="secondary" onclick="hideDetails()">إغلاق ✕</button>
<div id="detailContent"></div>
</div>
</div>
<footer>
SkyTrack — The World Above, In Real Time.<br>
Aircraft data: ADSB.lol. Map data: OpenStreetMap contributors.
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API="/.netlify/functions/aircraft";
const map=L.map("map").setView([20,0],2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
attribution:'&copy; OpenStreetMap contributors',
maxZoom:19
}).addTo(map);
let aircraft=[];
let markers={};
let favorites=JSON.parse(localStorage.getItem("skyFavorites")||"[]");
let history=JSON.parse(localStorage.getItem("skyHistory")||"[]");
let favoritesMode=false;
let language="ar";
let requestTimer=null;
let loading=false;
function getRadius(){
let z=map.getZoom();
if(z<=2)return 250;
if(z<=4)return 220;
if(z<=6)return 150;
if(z<=8)return 100;
if(z<=10)return 60;
return 30;
}
function scheduleRefresh(){
clearTimeout(requestTimer);
requestTimer=setTimeout(loadAircraft,1200);
}
async function loadAircraft(){
if(loading)return;
loading=true;
const center=map.getCenter();
const url=`${API}?lat=${center.lat.toFixed(3)}&lon=${center.lng.toFixed(3)}&radius=${getRadius()}`;
setStatus("جاري تحديث بيانات الطائرات...","Updating aircraft data...");
try{
const response=await fetch(url,{cache:"no-store"});
if(!response.ok)throw new Error("API error");
const data=await response.json();
aircraft=data.ac||[];
document.getElementById("count").textContent=aircraft.length;
const valid=aircraft.filter(a=>typeof a.alt_baro==="number");
const avg=valid.length?Math.round(valid.reduce((s,a)=>s+a.alt_baro,0)/valid.length):0;
document.getElementById("avgAltitude").textContent=avg.toLocaleString();
document.getElementById("updated").textContent=new Date().toLocaleTimeString();
updateMarkers();
renderFlights();
renderHistory();
setStatus("تم تحديث البيانات بنجاح","Data updated successfully");
}catch(e){
setStatus("تعذر تحميل البيانات. حاول مرة ثانية.","Unable to load aircraft data.");
}finally{
loading=false;
}
}
function setStatus(ar,en){
document.getElementById("status").textContent=language==="ar"?ar:en;
}
function getType(a){return (a.t||"غير معروف").toUpperCase()}
function updateMarkers(){
const visible=new Set();
aircraft.forEach(a=>{
if(!Number.isFinite(a.lat)||!Number.isFinite(a.lon)||!a.hex)return;
visible.add(a.hex);
const icon=L.divIcon({
className:"",
html:"<div style='font-size:22px'>✈️</div>",
iconSize:[28,28],
iconAnchor:[14,14]
});
if(markers[a.hex]){
markers[a.hex].setLatLng([a.lat,a.lon]);
}else{
markers[a.hex]=L.marker([a.lat,a.lon],{icon}).addTo(map);
markers[a.hex].on("click",()=>showDetails(a));
}
markers[a.hex].setIcon(icon);
markers[a.hex].bindPopup(`<b>${escapeHTML((a.flight||a.hex).trim())}</b><br>${escapeHTML(getType(a))}`);
});
Object.keys(markers).forEach(hex=>{
if(!visible.has(hex)){
map.removeLayer(markers[hex]);
delete markers[hex];
}
});
}
function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function renderFlights(){
const query=document.getElementById("search").value.toLowerCase().trim();
const type=document.getElementById("typeFilter").value.toUpperCase();
const results=aircraft.filter(a=>{
const text=[a.flight,a.hex,a.r,a.t].join(" ").toLowerCase();
return text.includes(query)&&(!type||getType(a).includes(type))&&(!favoritesMode||favorites.includes(a.hex));
});
const list=document.getElementById("flightList");
list.innerHTML="";
results.slice(0,100).forEach(a=>{
const card=document.createElement("div");
card.className="flight";
const title=document.createElement("strong");
title.textContent=(a.flight||"رحلة بدون رقم").trim();
const typeLine=document.createElement("p");
typeLine.textContent=`${getType(a)} • ${a.r||a.hex}`;
const altitude=document.createElement("p");
altitude.textContent=`الارتفاع: ${a.alt_baro??"--"} قدم`;
const speed=document.createElement("p");
speed.textContent=`السرعة: ${a.gs??"--"} عقدة`;
const details=document.createElement("button");
details.textContent="التفاصيل";
details.onclick=()=>showDetails(a);
const fav=document.createElement("button");
fav.className="secondary";
fav.textContent=favorites.includes(a.hex)?"★":"☆";
fav.onclick=()=>toggleFavorite(a.hex);
card.append(title,typeLine,altitude,speed,details,fav);
list.appendChild(card);
});
if(!results.length)list.textContent=language==="ar"?"ما حصلت طائرات مطابقة.":"No matching aircraft.";
}
async function getAircraftPhoto(registration){
if(!registration)return null;
try{
const response=await fetch("https://api.planespotters.net/pub/photos/reg/"+encodeURIComponent(registration));
if(!response.ok)return null;
const data=await response.json();
return data.photos?.[0]||null;
}catch(e){return null}
}
async function showDetails(a){
const content=document.getElementById("detailContent");
content.innerHTML="";
const title=document.createElement("h2");
title.textContent=(a.flight||"رحلة بدون رقم").trim();
content.appendChild(title);
const photo=document.createElement("p");
photo.className="muted";
photo.textContent="جاري البحث عن صورة الطائرة...";
content.appendChild(photo);
const fields=[
["التسجيل",a.r],
["ICAO",a.hex],
["نوع الطائرة",a.t],
["الارتفاع (قدم)",a.alt_baro],
["السرعة (عقدة)",a.gs],
["الاتجاه",a.track],
["خط العرض",a.lat],
["خط الطول",a.lon]
];
fields.forEach(([label,value])=>{
const row=document.createElement("div");
row.className="row";
const left=document.createElement("span");
left.textContent=label;
const right=document.createElement("strong");
right.textContent=value??"--";
row.append(left,right);
content.appendChild(row);
});
document.getElementById("details").style.display="flex";
history=[a.hex,...history.filter(x=>x!==a.hex)].slice(0,10);
localStorage.setItem("skyHistory",JSON.stringify(history));
renderHistory();
const imageData=await getAircraftPhoto(a.r);
if(imageData?.thumbnail_large){
const img=document.createElement("img");
img.src=imageData.thumbnail_large;
img.alt="صورة الطائرة";
content.insertBefore(img,content.children[1]);
const credit=document.createElement("p");
credit.className="muted";
credit.textContent="Photo: "+(imageData.photographer||"Photographer");
content.insertBefore(credit,content.children[2]);
photo.remove();
}else{
photo.textContent="لا تتوفر صورة لهذا التسجيل حالياً.";
}
}
function hideDetails(){
document.getElementById("details").style.display="none";
}
function closeDetails(e){
if(e.target.id==="details")hideDetails();
}
function toggleFavorite(hex){
favorites=favorites.includes(hex)?favorites.filter(x=>x!==hex):[...favorites,hex];
localStorage.setItem("skyFavorites",JSON.stringify(favorites));
renderFlights();
}
function toggleFavorites(){
favoritesMode=!favoritesMode;
document.getElementById("favBtn").textContent=favoritesMode?"عرض الكل":"المفضلة ★";
renderFlights();
}
function renderHistory(){
const list=document.getElementById("historyList");
list.innerHTML="";
history.forEach(hex=>{
const a=aircraft.find(x=>x.hex===hex);
const item=document.createElement("div");
item.className="flight";
item.textContent=a?(a.flight||a.hex).trim():hex;
list.appendChild(item);
});
}
function locateMe(){
if(!navigator.geolocation){
alert("الموقع غير مدعوم");
return;
}
navigator.geolocation.getCurrentPosition(position=>{
map.setView([position.coords.latitude,position.coords.longitude],8);
},()=>{
alert("تعذر تحديد موقعك. تأكد من السماح للموقع.");
});
}
function toggleLanguage(){
language=language==="ar"?"en":"ar";
document.documentElement.lang=language;
document.documentElement.dir=language==="ar"?"rtl":"ltr";
const labels={
welcome:["العالم فوقك، لحظة بلحظة.","The World Above, In Real Time."],
aircraftLabel:["الطائرات المعروضة","Aircraft displayed"],
altitudeLabel:["متوسط الارتفاع (قدم)","Average altitude (ft)"],
updateLabel:["آخر تحديث","Last update"],
locationBtn:["موقعي","My location"],
historyTitle:["آخر الطائرات التي شاهدتها","Recently viewed aircraft"],
listTitle:["الرحلات القريبة من الخريطة","Aircraft around map"]
};
Object.entries(labels).forEach(([id,v])=>{
document.getElementById(id).textContent=language==="ar"?v[0]:v[1];
});
document.getElementById("langBtn").textContent=language==="ar"?"English":"العربية";
document.getElementById("search").placeholder=language==="ar"?"ابحث برقم الرحلة أو التسجيل أو ICAO":"Search flight, registration or ICAO";
renderFlights();
renderHistory();
}
document.getElementById("search").addEventListener("input",renderFlights);
document.getElementById("typeFilter").addEventListener("change",renderFlights);
map.on("moveend",scheduleRefresh);
map.on("zoomend",scheduleRefresh);
loadAircraft();
setInterval(loadAircraft,20000);
renderHistory();
</script>
</body>
</html>
